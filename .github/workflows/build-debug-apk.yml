name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Enable pnpm
        run: npm install -g pnpm@10

      - name: Install JS dependencies (workspace)
        run: pnpm install --no-frozen-lockfile

      - name: Install React Native (needed by Android Gradle)
        run: npm install react-native@0.73.6 react@18.2.0 react-dom@18.2.0 --prefix ./rn_host --legacy-peer-deps

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Patch node_modules path in Gradle files
        run: |
          RN_PATH="$(pwd)/rn_host/node_modules"
          sed -i "s|../node_modules|$RN_PATH|g" android/build.gradle
          sed -i "s|../node_modules|$RN_PATH|g" android/app/build.gradle
          sed -i "s|../node_modules|$RN_PATH|g" android/settings.gradle || true

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --no-daemon \
            --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIMxASSIST-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
